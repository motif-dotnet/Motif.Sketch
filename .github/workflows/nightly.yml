# Every night, and when run by hand: every spec, the nightly ones too (Kind=Nightly, left out of
# pages.yml to keep pushes fast), with the browser specs in Edge and in Chrome. Nothing is deployed.
# GitHub emails a scheduled run's failure only to whoever last changed the cron line below.
name: Nightly

on:
  schedule:
    # Off the hour: runs set on the hour are the ones GitHub delays most.
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [msedge, chrome]
    name: specs (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Motif.Sketch.sln -c Release

      - name: Specs
        run: >
          dotnet test Checks/Motif.Sketch.Specs -c Release --no-build
          --logger "trx;LogFileName=specs.trx" --results-directory results

      - name: Publish
        run: dotnet publish Motif.Sketch.App -c Release -o publish

      - name: Browser specs
        env:
          MOTIF_SITE: ${{ github.workspace }}/publish
          MOTIF_BROWSER: ${{ matrix.browser }}
        run: >
          dotnet test Checks/Motif.Sketch.BrowserSpecs -c Release --no-build
          --logger "trx;LogFileName=browser-specs.trx" --results-directory results

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $ms = { param($time) if ($time) { [int]([timespan]$time).TotalMilliseconds } else { 0 } }
          $lines = @('### Specs', '', '| | Passed | Failed | Skipped | The specs took | The run took |', '|---|---|---|---|---|---|')
          $all = @()
          foreach ($file in Get-ChildItem results -Filter *.trx -ErrorAction SilentlyContinue) {
            $run = ([xml](Get-Content $file.FullName)).TestRun
            $counts = $run.ResultSummary.Counters
            $specs = @($run.Results.UnitTestResult)
            $all += $specs
            $total = ($specs | ForEach-Object { & $ms $_.duration } | Measure-Object -Sum).Sum
            $whole = & $ms ([datetime]$run.Times.finish - [datetime]$run.Times.start)
            $lines += "| $($file.BaseName) | $($counts.passed) | $($counts.failed) | $($counts.notExecuted) | $total ms | $whole ms |"
          }
          $lines += '', '| Slowest | Time |', '|---|---|'
          $lines += $all | Sort-Object { [timespan]$_.duration } -Descending | Select-Object -First 5 |
            ForEach-Object { "| ``$($_.testName)`` | $(& $ms $_.duration) ms |" }
          $lines | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
